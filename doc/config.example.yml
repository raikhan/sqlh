# sqlh configuration: ~/.config/sqlh/config.yml (or pass -config <file>)
# The first connection is the default; switch with
#   :lsp-workspace-command switchConnections "<alias>"

lowercaseKeywords: true
# Insert all-upper-case identifiers (Oracle's stored form) in lower case.
# Mixed-case names are left alone.
lowercaseIdentifiers: true

# Underline unknown tables, columns, … (checked against the schema cache). Default: true.
# diagnostics: true
# Reload the schema cache after a run that executed DDL (CREATE, ALTER, DROP, RENAME,
# COMMENT). Default: true. `space i U` / `sqlh refresh` reload by hand.
# refreshAfterDDL: true

# Relationships between tables (table picker, join completion)
relations:
  insert: join   # after JOIN the table picker inserts "t alias ON …" (join) or the name (name)
  maybe: true    # also offer relationships guessed from column names (customer_id → customer.id)

# Query results ("Run → CSV" / "Export → CSV" code actions)
results:
  # {workspace} = the editor's project root; also {home}, {conn}, "~"
  dir: "{workspace}/.sqlh/results"   # .sqlh/ gets a self-ignoring .gitignore
  previewLimit: 100                   # rows for "Run → CSV" and the text view
  null: ""                            # text written for SQL NULL
  reuseFor: 10m                       # `space i d` copies a complete result this recent (0: never)
  # opens results (`sqlh open`, `run --open`); "{}" = the file(s). Default: open / xdg-open
  # viewer: ["~/.config/helix/open-in-herdr-pane.nu", "0.8", "vd", "{}"]

# The side panel next to Helix (`sqlh panel`, space i t) and `sqlh tui`
panel:
  placement: right            # right (default), left, up or down: half of the editor's pane
  # keys sent to Helix to insert what the panel chose: they must run
  # `:insert-output sqlh panel take …` (the hidden binding space i P, see doc/cli.md)
  # insertKeys: [esc, space, i, P]
  keys:
    backToEditor: backspace   # focus the panel's Helix pane (Bubble Tea key names)
  # icons: unicode            # unicode (default), nerd (Nerd Font) or ascii
tui:
  queriesDir: queries         # new query files: relative to the workspace, or absolute
  # editor: [hx]              # the editor `sqlh tui` opens query files in (file appended)

connections:
  - alias: pg_local
    driver: postgresql
    # search_path makes unqualified completion and FK join hints use your schema
    dataSourceName: host=localhost port=5432 user=admin password=${PG_LOCAL_PASSWORD} dbname=sdsai sslmode=disable options='-c search_path=cadetst,public'
    # optional metadata allow-list (PostgreSQL: empty = all schemas); also the schemas
    # `sqlh schema` switches between, the first being the current one on connect
    # (SET search_path after connecting: works behind PgBouncer, which refuses it in the DSN)
    # schemas: [cadetst, public]
    environment: dev          # dev (default), test or prod: shown in the panel and
                              # `sqlh status`; sample rows are automatic on dev/test only
    # sample: auto            # the panel's sample rows: auto, manual (on request) or off

  - alias: oracle_dev
    driver: oracle            # pure Go (go-ora): no Oracle Instant Client needed
    host: oracle.example.com
    port: 1521
    dbName: CADEV1            # service name
    user: cade
    # password from the macOS keychain, created with:
    #   security add-generic-password -a cade -s sqlh-oracle_dev -w '<password>'
    passwdCmd: security find-generic-password -s sqlh-oracle_dev -w
    # metadata allow-list (Oracle: empty = login schema only). The first is the current
    # schema on connect (ALTER SESSION SET CURRENT_SCHEMA): unqualified names resolve in
    # CADE even for another login; `sqlh schema` / space i S switch among them
    schemas: [CADE, CADE500]
    # schema: CADE500         # start on another schema of the list
    # params are go-ora URL options, e.g.:
    # params: { "SSL": "true", "TIMEOUT": "30" }
    # or a full go-ora URL / TNS descriptor:
    # dataSourceName: oracle://user:${ORA_PW}@host:1521/service

  - alias: scratch
    driver: sqlite3
    dataSourceName: file:./scratch.db

# Secrets: ${NAME} is expanded from the environment in user, passwd and
# dataSourceName (bare $NAME is left literal). passwdCmd runs only when passwd
# is empty, at connect time.
